name: Build macOS DMG Standalone App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build & Test macOS Standalone (.app & .dmg)
    runs-on: macos-14 # Apple Silicon (M1/M2/M3)
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Micromamba (Pre-compiled GDAL & Numba)
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: sedinconnect-build
          create-args: >-
            python=3.11
            gdal
            numba
            numpy
            scipy
            matplotlib
            pyqt
            pyinstaller
          channels: conda-forge

      - name: Install SedInConnect Package
        shell: bash -l {0}
        run: |
          pip install -e python_package

      - name: Build macOS App Bundle and DMG
        shell: bash -l {0}
        run: |
          python build_macos_app.py

      - name: 🧪 Automated Verification Test on macOS
        shell: bash -l {0}
        run: |
          echo "=== 1. Mounting DMG disk image ==="
          mkdir -p /tmp/sed_mount
          hdiutil attach dist/SedInConnect_3.2_macOS.dmg -mountpoint /tmp/sed_mount

          APP_EXEC="/tmp/sed_mount/SedInConnect.app/Contents/MacOS/SedInConnect"
          if [ ! -f "$APP_EXEC" ]; then
            echo "Error: Binary not found at $APP_EXEC"
            exit 1
          fi

          echo "=== 2. Running Test Calculation in macOS Standalone App ==="
          "$APP_EXEC" \
            --dtm test_data/dtmfel.tif \
            --target test_data/target.shp \
            --output /tmp/ic_mac_test.tif \
            --window 3

          if [ -f "/tmp/ic_mac_test.tif" ]; then
            echo "✅ Calculation completed successfully! Output raster exists:"
            ls -lh /tmp/ic_mac_test.tif
          else
            echo "❌ Error: Output raster /tmp/ic_mac_test.tif was not generated!"
            exit 1
          fi

          echo "=== 3. Testing GUI Offscreen Initialization ==="
          QT_QPA_PLATFORM=offscreen timeout 4 "$APP_EXEC" || true
          echo "✅ GUI initialized cleanly in macOS environment!"

          echo "=== 4. Unmounting DMG ==="
          hdiutil detach /tmp/sed_mount

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SedInConnect_3.2_macOS_AppleSilicon
          path: dist/SedInConnect_3.2_macOS.dmg
          if-no-files-found: error
